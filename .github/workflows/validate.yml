name: Validate pull requests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

 # Runs for each update pushed to the PR branch.
# Also generates Astro's route and environment declarations before TypeScript checks.
# Lint and production build gate this pull request.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx astro sync
      - run: bun run format
      - run: bun run build
